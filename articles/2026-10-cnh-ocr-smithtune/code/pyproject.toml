[project]
name = "cnh-ocr"
version = "0.1.0"
description = "Reading Brazilian CNHs with fine-tuned open OCR models + a smithtune-distilled extraction agent"
readme = "README.md"
authors = [
    { name = "Ricardo Cunha", email = "ricardocunha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.39.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.6",
    "langsmith>=0.14.1",
    "python-dotenv>=1.2.3",
]
mlx = [
    "mlx-vlm[train]>=0.7.3",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "validate-docbr>=2.0.0",
]
