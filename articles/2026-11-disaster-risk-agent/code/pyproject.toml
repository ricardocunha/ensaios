[project]
name = "disaster-risk"
version = "0.1.0"
description = "Disaster-risk agent: signal adapters, fusion and backtest for the RS 2024 floods"
readme = "README.md"
authors = [
    { name = "Ricardo Cunha", email = "ricardocunha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=2.52.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
